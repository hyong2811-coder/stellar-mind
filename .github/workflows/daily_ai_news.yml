name: Daily Automated AI News Crawler

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  crawl_and_update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run AI News Crawler Script
        run: |
          python3 scripts/ai_news_crawler.py

      - name: Commit and Push Updated News to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add js/config.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): 🤖 每日 AI 领袖与官网资讯自动更新 [skip ci]" && git push)
